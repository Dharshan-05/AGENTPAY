version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Local Development DB)
  # ----------------------------------------------------------------------------
  agentpay-postgres:
    image: postgres:15-alpine
    container_name: agentpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agentpay_dev}
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentpay_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agentpay-network

  # ----------------------------------------------------------------------------
  # 2. Redis Caching & Signal Store Service
  # ----------------------------------------------------------------------------
  agentpay-redis:
    image: redis:7-alpine
    container_name: agentpay-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - agentpay-network

  # ----------------------------------------------------------------------------
  # 3. AGENTPAY Backend Service (FastAPI / Agent Runtime)
  # ----------------------------------------------------------------------------
  agentpay-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentpay-backend
    restart: unless-stopped
    environment:
      APP_NAME: "AGENTPAY API"
      APP_ENV: ${APP_ENV:-development}
      PORT: 8000
      HOST: "0.0.0.0"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pass}
      POSTGRES_HOST: ${POSTGRES_HOST:-agentpay-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-agentpay_dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres_dev_pass@agentpay-postgres:5432/agentpay_dev}
      REDIS_URL: ${REDIS_URL:-redis://agentpay-redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_32chars_min}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - '8000:8000'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      agentpay-postgres:
        condition: service_healthy
      agentpay-redis:
        condition: service_healthy
    networks:
      - agentpay-network

  # ----------------------------------------------------------------------------
  # 4. AGENTPAY Frontend Service (Next.js Control Plane)
  # ----------------------------------------------------------------------------
  agentpay-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: agentpay-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - '3000:3000'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      agentpay-backend:
        condition: service_healthy
    networks:
      - agentpay-network

volumes:
  postgres_data:
  redis_data:

networks:
  agentpay-network:
    driver: bridge
