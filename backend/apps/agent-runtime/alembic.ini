# A generic, single database configuration for AGENTPAY Alembic migrations.

[alembic]
# Path to migration environment script directory
script_location = alembic

# Revision file naming template: <revision>_<slug>
file_template = %%(rev)s_%%(slug)s

# Sys.path prepend to ensure application modules are importable
prepend_sys_path = .

# Format for date outputs in migration files
timezone = UTC

# Max length of slug field in migration filenames
truncate_slug_length = 40

# Revision environment strategy
revision_environment = false

# Sourceless migration execution support (.pyc)
sourceless = false

# Version location path
version_locations = %(here)s/alembic/versions

# Version path separator
version_path_separator = os

[post_write_hooks]

# Logging configuration
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

