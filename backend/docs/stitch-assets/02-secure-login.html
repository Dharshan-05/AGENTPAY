</div>

<span class="material-symbols-outlined absolute left-4 text-on-surface-variant group-focus-within:text-tertiary transition-colors">lock</span>
<input class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 py-3 pl-12 pr-4 rounded-lg font-body-md" placeholder="Password" required="" type="password"/>
</div>

<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-dim text-tertiary focus:ring-tertiary focus:ring-offset-background" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
