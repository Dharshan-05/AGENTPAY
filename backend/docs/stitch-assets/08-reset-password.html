<!-- Atmospheric background elements -->
<div class="absolute inset-0 z-0 pointer-events-none">
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container/20 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[40%] h-[40%] rounded-full bg-tertiary-container/20 blur-[100px]"></div>

<!-- Main Auth Card -->
<div class="relative z-10 w-full max-w-md bg-surface-container-low border border-outline-variant rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.5)] overflow-hidden">
<!-- Header -->
<div class="px-8 pt-8 pb-6 border-b border-outline-variant/30 text-center">
<div class="flex justify-center items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary text-3xl">shield_person</span>
<span class="font-headline-lg text-headline-lg text-primary tracking-tight">AgentPay</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Reset Password</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your email to receive a secure reset link.</p>
</div>
<!-- Form Area -->
<div class="p-8">
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-technical text-label-technical text-on-surface-variant block uppercase" for="email">Account Email</label>
<div class="relative glow-active rounded border border-outline-variant bg-surface-dim transition-all duration-300">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-sm">mail</span>
</div>
<input class="w-full bg-transparent border-none py-2.5 pl-10 pr-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 rounded" id="email" name="email" placeholder="agent@enterprise.com" required="" type="email"/>
</div>
</div>
<!-- Password Requirements Checklist -->
<div class="bg-surface-container-lowest border border-outline-variant/50 rounded-lg p-4 space-y-2">
<p class="font-label-technical text-label-technical text-on-surface-variant uppercase mb-3">New Password Requirements</p>
<ul class="space-y-2 font-body-sm text-body-sm text-on-surface-variant">
<li class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">check_circle</span>
<span>Minimum 8 characters</span>
</li>
<li class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">check_circle</span>
<span>At least one uppercase letter</span>
</li>
<li class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-[16px]">check_circle</span>
<span>At least one number or symbol</span>
</li>
</ul>
</div>
<!-- Actions -->
<div class="pt-2">
<button class="w-full py-3 px-4 bg-primary-container text-on-primary-container font-button-text text-button-text rounded transition-all duration-300 hover:bg-primary hover:text-on-primary hover:shadow-[0_0_15px_rgba(37,99,235,0.4)] flex justify-center items-center gap-2" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>

<div class="mt-8 text-center border-t border-outline-variant/30 pt-6">
<p class="font-body-sm text-body-sm text-on-surface-variant">
