<style>
        .neon-border {
            position: relative;
        }
        .neon-border::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(76, 215, 246, 0.4), rgba(37, 99, 235, 0.1));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        
        .otp-input:focus {
            outline: none;
            box-shadow: 0 0 0 1px #4cd7f6, 0 0 8px rgba(76, 215, 246, 0.5);
            border-color: #4cd7f6;
        }
        
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(76, 215, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(76, 215, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 215, 246, 0); }
        }
        
        .loading-pulse {
            animation: pulse-glow 2s infinite;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md overflow-hidden">
<!-- Abstract Ambient Background -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-container-high/40 via-background to-background"></div>
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-tertiary-container/10 rounded-full blur-[120px]"></div>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-md p-6">
<!-- Brand Header -->
<div class="flex items-center justify-center gap-2 mb-8">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-headline-xl text-headline-xl text-primary font-bold tracking-tight">AgentPay</span>
</div>
<!-- 2FA Card -->
<div class="bg-surface-container/60 backdrop-blur-xl border border-outline-variant/40 rounded-xl p-8 shadow-[0_8px_32px_rgba(0,0,0,0.4)] neon-border">
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-highest border border-outline-variant/50 mb-4 shadow-[0_0_15px_rgba(76,215,246,0.15)] relative">
<span class="material-symbols-outlined text-tertiary text-2xl" style="font-variation-settings: 'FILL' 1;">lock</span>
<div class="absolute -right-1 -bottom-1 w-5 h-5 bg-background rounded-full flex items-center justify-center border border-outline-variant/30">
<div class="w-3 h-3 bg-tertiary rounded-full animate-pulse shadow-[0_0_8px_rgba(76,215,246,0.8)]"></div>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Two-Factor Authentication</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter the 6-digit code generated by your authenticator app.</p>
</div>
<!-- Form -->
<form class="space-y-6" id="otp-form">
<!-- OTP Inputs -->
<div class="flex justify-between gap-2" id="otp-container">
<input autofocus="" class="otp-input w-12 h-14 bg-surface text-center font-headline-lg text-headline-lg text-on-surface border border-outline-variant rounded-lg transition-all duration-200 focus:bg-surface-container-low" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface text-center font-headline-lg text-headline-lg text-on-surface border border-outline-variant rounded-lg transition-all duration-200 focus:bg-surface-container-low" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface text-center font-headline-lg text-headline-lg text-on-surface border border-outline-variant rounded-lg transition-all duration-200 focus:bg-surface-container-low" maxlength="1" type="text"/>
<div class="w-2 h-14 flex items-center justify-center">
<div class="w-1.5 h-0.5 bg-outline-variant/50 rounded-full"></div>
</div>
<input class="otp-input w-12 h-14 bg-surface text-center font-headline-lg text-headline-lg text-on-surface border border-outline-variant rounded-lg transition-all duration-200 focus:bg-surface-container-low" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface text-center font-headline-lg text-headline-lg text-on-surface border border-outline-variant rounded-lg transition-all duration-200 focus:bg-surface-container-low" maxlength="1" type="text"/>
<input class="otp-input w-12 h-14 bg-surface text-center font-headline-lg text-headline-lg text-on-surface border border-outline-variant rounded-lg transition-all duration-200 focus:bg-surface-container-low" maxlength="1" type="text"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-button-text text-button-text py-3 px-4 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(37,99,235,0.2)] hover:shadow-[0_0_20px_rgba(37,99,235,0.4)]" id="submit-btn" type="submit">
<span id="btn-text">Verify &amp; Continue</span>
<span class="material-symbols-outlined text-sm hidden" id="btn-spinner">sync</span>
</button>
<!-- Action Links -->
<div class="flex justify-between items-center mt-4">
<a class="font-body-sm text-body-sm text-tertiary hover:text-tertiary-fixed transition-colors" href="#">Use recovery code</a>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[14px]">help</span> Need help?
                    </a>
</div>
</form>
</div>
<!-- Secure Connection Indicator -->
<div class="mt-8 text-center flex items-center justify-center gap-2 font-label-technical text-label-technical text-on-surface-variant opacity-70">
<span class="material-symbols-outlined text-[14px] text-tertiary">encrypted</span>
            End-to-end encrypted connection
        </div>
</main>
<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.otp-input');
        const form = document.getElementById('otp-form');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Allow only numbers
                input.value = input.value.replace(/[^0-9]/g, '');
                
                if (input.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });
        
        // Simulating form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Basic validation check
            let isComplete = true;
            inputs.forEach(input => {
                if(input.value.length === 0) isComplete = false;
            });
            
            if(!isComplete) return;

            // Loading state
            btnText.textContent = 'Connecting securely...';
            btnSpinner.classList.remove('hidden');
            btnSpinner.classList.add('animate-spin');
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed', 'loading-pulse');
            inputs.forEach(input => input.disabled = true);
            
            // Reset after 3s to simulate process
            setTimeout(() => {
                btnText.textContent = 'Verify & Continue';
                btnSpinner.classList.add('hidden');
                btnSpinner.classList.remove('animate-spin');
                submitBtn.classList.remove('opacity-80', 'cursor-not-allowed', 'loading-pulse');
                inputs.forEach(input => {
                    input.disabled = false;
                    input.value = '';
                });
                inputs[0].focus();
            }, 3000);
        });
    </script>
</body></html>
